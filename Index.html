<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Sales</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #fullscreen-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      cursor: pointer;
    }
    #fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwdd336VDaKLej0UTTI28VkmFPBEy6pJsEOwBp7dXLvrPpWInTyyg4-UZjDLiInCPz6dA/exec"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <button id="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>

  <script>
    function goFullscreen() {
      const iframe = document.getElementById('app-frame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen().catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
      }
    }

    // Automatically hide the button when fullscreen is active
    document.addEventListener('fullscreenchange', () => {
      const btn = document.getElementById('fullscreen-btn');
      btn.style.display = document.fullscreenElement ? 'none' : 'block';
    });
  </script>

</body>
</html>
